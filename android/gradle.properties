# Gradle JVM 参数：给编译器分配足够内存
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# 启用并行构建和按需配置，加快 CI 速度
org.gradle.parallel=true
org.gradle.configureondemand=true
# AndroidX 迁移
android.useAndroidX=true
# Kotlin 代码风格
kotlin.code.style=official
# 关闭旧版资源命名，减少 R 类冗余
android.nonTransitiveRClass=true
# 抑制 compileSdk 兼容性警告（AGP 8.6.1 已正式支持 compileSdk=35）
android.suppressUnsupportedCompileSdk=35

# 防止 GitHub Actions 环境下官方 Maven 源偶尔 429 限流导致的构建失败
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000
systemProp.org.gradle.internal.repository.max.tentatives=5
systemProp.org.gradle.internal.repository.initial.backoff=1000
