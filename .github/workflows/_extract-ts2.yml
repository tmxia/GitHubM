# 临时诊断工作流（第二批）：抽取剩余 TS 报错上下文，拆成多个小文件避免读取截断
name: Extract TS Context 2

on:
  push:
    paths:
      - '.github/workflows/_extract-ts2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    name: Dump remaining context
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 抽取
        run: |
          set +e
          G=src/services/github.ts
          A=src/pages/AiAssistantV2Page.tsx
          awk 'NR>=2790 && NR<=2848 {printf "%d| %s\n", NR, $0}' "$G" > diag-a.txt
          awk 'NR>=2470 && NR<=2510 {printf "%d| %s\n", NR, $0}' "$A" > diag-b.txt
          {
            echo "== KeyboardInsetState refs =="
            grep -rn "KeyboardInsetState" src/
          } > diag-c.txt
          {
            echo "== d.ts under src =="
            find src -name "*.d.ts" -maxdepth 3
            echo "== vite client ?url decl =="
            ls node_modules/vite/client.d.ts 2>/dev/null
            grep -n "?url" node_modules/vite/client.d.ts 2>/dev/null | head -20
            echo "== pdfjs-dist exports =="
            grep -n "pdf.worker" node_modules/pdfjs-dist/package.json 2>/dev/null | head -20
          } > diag-d.txt
          rm -f diagnostic-ts.txt
          wc -c diag-a.txt diag-b.txt diag-c.txt diag-d.txt

      - name: 提交抽取结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A diag-a.txt diag-b.txt diag-c.txt diag-d.txt diagnostic-ts.txt
          git commit -m "chore(diag): 抽取剩余 TS 上下文 [skip ci]"
          git push
